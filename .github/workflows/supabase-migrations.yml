name: Supabase migrations

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: aws-0-us-west-2.pooler.supabase.com
      SUPABASE_DB_USER: postgres.fvfkgikkfhscnvuizegc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check database connection secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Configure the SUPABASE_DB_PASSWORD repository secret before running migrations."
            exit 1
          fi

      - name: Build encoded database URL
        shell: bash
        run: |
          encoded_password=$(python -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          echo "SUPABASE_DB_URL=postgresql://${SUPABASE_DB_USER}:${encoded_password}@${SUPABASE_DB_HOST}:5432/postgres" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
